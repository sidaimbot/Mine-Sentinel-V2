name: Repo analyzer

on:
  workflow_dispatch:
    inputs:
      max_mrs:
        description: "How many PRs to fetch (0 = all; lower is faster)"
        required: false
        default: "0"
      max_commit_scan:
        description: "How many commits to scan for AI signatures (0 = all)"
        required: false
        default: "0"
      workers:
        description: "Parallel API requests"
        required: false
        default: "8"

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip requests

      - name: Run repo_analyzer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_MRS: ${{ inputs.max_mrs }}
          MAX_COMMIT_SCAN: ${{ inputs.max_commit_scan }}
          WORKERS: ${{ inputs.workers }}
        run: |
          set -euo pipefail
          if [ ! -f repo_analyzer.py ]; then
            echo "::error::repo_analyzer.py was not found in the repository root. Add it next to this workflow."
            exit 1
          fi
          echo "Analyzing ${GITHUB_REPOSITORY}"
          python repo_analyzer.py \
            --provider github \
            --project "${GITHUB_REPOSITORY}" \
            --max-mrs "${MAX_MRS}" \
            --max-commit-scan "${MAX_COMMIT_SCAN}" \
            --workers "${WORKERS}" \
            --output report.csv

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-analyzer-report
          path: |
            report.csv
            report_detail.json
          if-no-files-found: warn
